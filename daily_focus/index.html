<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Focus</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .hidden { display: none; }
        .task { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .task.completed span { text-decoration: line-through; color: #888; }
        .task span { flex-grow: 1; }
        .filters { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
        .filter-btn.active { font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Daily Focus</h1>
    <p>A simple daily task tracker to keep you focused.</p>
    
    <div>
        <input type="text" id="task-input" placeholder="What needs to be done?" aria-label="New task">
        <button id="add-task-btn">Add task</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <span id="active-count">0 active tasks</span>
    </div>

    <div id="empty-state">No tasks exist. Add one above!</div>
    <div id="task-list"></div>

    <script>
        const input = document.getElementById('task-input');
        const addBtn = document.getElementById('add-task-btn');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const activeCount = document.getElementById('active-count');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let tasks = [];
        let currentFilter = 'all';

        function loadTasks() {
            try {
                const saved = localStorage.getItem('daily_focus_tasks');
                if (saved) tasks = JSON.parse(saved);
                if (!Array.isArray(tasks)) tasks = [];
            } catch (e) {
                tasks = [];
            }
            render();
        }

        function saveTasks() {
            localStorage.setItem('daily_focus_tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const text = input.value.trim();
            if (!text) return;
            tasks.push({ id: Date.now(), text, completed: false });
            input.value = '';
            saveTasks();
            render();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            filterBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
            render();
        }

        function render() {
            const filteredTasks = tasks.filter(t => {
                if (currentFilter === 'active') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            taskList.innerHTML = '';
            filteredTasks.forEach(t => {
                const div = document.createElement('div');
                div.className = `task ${t.completed ? 'completed' : ''}`;
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = t.completed;
                checkbox.ariaLabel = `Mark ${t.text} as ${t.completed ? 'incomplete' : 'complete'}`;
                checkbox.onclick = () => toggleTask(t.id);
                
                const span = document.createElement('span');
                span.textContent = t.text;
                
                const delBtn = document.createElement('button');
                delBtn.textContent = 'Delete';
                delBtn.ariaLabel = `Delete ${t.text}`;
                delBtn.onclick = () => deleteTask(t.id);
                
                div.append(checkbox, span, delBtn);
                taskList.appendChild(div);
            });

            emptyState.className = tasks.length === 0 ? '' : 'hidden';
            const active = tasks.filter(t => !t.completed).length;
            activeCount.textContent = `${active} active task${active !== 1 ? 's' : ''}`;
        }

        addBtn.onclick = addTask;
        input.onkeypress = (e) => { if (e.key === 'Enter') addTask(); };
        filterBtns.forEach(btn => btn.onclick = () => setFilter(btn.dataset.filter));

        loadTasks();
    </script>
</body>
</html>
